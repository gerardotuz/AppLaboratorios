services:
  - type: web
    name: soporte-cbtis-272
    runtime: node
    plan: free
     # Render no instala dependencias cuando el comando de build esta vacio.
    # Instalar solo las dependencias de produccion antes de iniciar el servidor.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cbtis272_soporte
